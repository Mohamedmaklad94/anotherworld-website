<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title> مسابقة المحاور - Another World Photography</title>
  <!-- CSS -->
  <link rel="stylesheet" href="css/style-v3.css" />
   <link rel="stylesheet" href="css/style-v3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">


  <style>
    .theme-hero {
      min-height: 100vh;
      background: url('../img/gallery/theme-hero.jpg') no-repeat center center;
      background-size: cover;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }


    .theme-hero h1 {
      font-family: 'Cairo', sans-serif !important;
      font-size: 4rem;
      font-weight: 650;
      color: #415484;
      margin-bottom: 70px;
      text-shadow: 0 2px 10px rgba(54, 45, 45, 0.5);
      letter-spacing: -3.5px;
    }
    
   .hero-line1 {
    font-size: 2.5rem;   /* حجم الخط للنص الأول */
    margin-top: -100px;    /* المسافة من الهيرو */
    margin-bottom: 0px;  
    color: #1a2c5a;
    text-shadow: 0 2px 10px rgba(54, 45, 45, 1.5);
    line-height: 1.2;
    font-weight: 600;
}

.hero-line2 {
    font-size: 2rem;     /* حجم الخط للنص الثاني */
    margin-top: 5px;     /* أقرب للنص الأول */
    margin-bottom: 0;
    color: #1a2c5a;
    line-height: 1.2;
    font-weight: 500;
}
    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .theme-hero h1 {
        font-size: 2.8rem;
        margin-bottom: 80px;
      }
      
      .section-title {
        font-size: 2.2rem;
      }
      
      .timeline::before {
        right: 30px;
      }
      
      .timeline-content {
        width: calc(100% - 80px);
        margin-right: 50px;
      }
      
      .timeline-item:nth-child(even) .timeline-content {
        margin-right: 0;
        margin-left: 50px;
      }
      
      .timeline-date {
        position: relative;
        top: 0;
        left: 0 !important;
        right: 0 !important;
        margin-bottom: 15px;
        display: inline-block;
      }
      
      .form-container {
        padding: 30px 20px;
      }
    }


  </style>
</head>
<body class="theme-body">
  <div id="header"></div>
  <script>
    fetch("components/header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("header").innerHTML = data;
      });
  </script>

  <!-- الهيرو -->
<section class="theme-hero">
  <h1>   المسابقة مازالت قيد التحديث </h1>
  <p class="hero-line1"> يتم تحديث صفحة مسابقة المحاور في هذة اللحظة</p>
  <p class="hero-line2">بإمكانك العودة لاحقًا</p>
</section>




  <!-- HEADER SCROLL -->
  <script>
    window.addEventListener("scroll", function () {
      const navbar = document.querySelector(".navbar");
      if (window.scrollY > 50) {
        navbar.classList.add("scrolled");
      } else {
        navbar.classList.remove("scrolled");
      }
    });
    
  </script>
  
  <!-- الفوتر -->
  <div id="footer"></div>
  <script>
    fetch("components/footer.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      })
      .catch(err => {
        console.error("Error loading footer:", err);
        document.getElementById("footer").innerHTML = `
          <footer style="background:#000;color:#fff;padding:40px;text-align:center">
            <p>Another World Photography © 2024</p>
          </footer>
        `;
      });
  </script>


  <!-- HEADER SCROLL -->
<script>
  window.addEventListener("scroll", function () {
    const navbar = document.querySelector(".navbar");
    if (window.scrollY > 50) {
      navbar.classList.add("scrolled");
    } else {
      navbar.classList.remove("scrolled");
    }
  });
</script>
</body>
</html>

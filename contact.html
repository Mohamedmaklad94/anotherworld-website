<style>
:root{
    --btn-bg:#f4a43a;
    --btn-hover:#5181b1;
    --modal-bg:rgba(0,0,0,.65);
}

.contact-body .contact-card,
.contact-body .contact-card * {
    font-family:'Montserrat',system-ui;
}





/* إيقاف أي تأثيرات scroll */
body.contact-page .navbar {
    will-change: unset !important;
}


/*الحقول داخل المودال */

.field {
  position: relative;
}

.field i {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #f4a43a;
  pointer-events: none;
}



.field textarea {
  padding-top: 12px;
    padding-right: 52px;
    box-sizing: border-box;

}


.contact-card *,
.contact-card *::before,
.contact-card *::after {
  box-sizing: border-box;
}

/* مسح القاعدتين القديمتين وإضافة هذه بدلاً منهما */

/* توحيد جميع حقول الإدخال */
.field input,
.field textarea,
#joinModal input,
#joinModal textarea {
    padding-right: 42px !important; /* قيمة موحدة */
    padding-left: 12px !important;
    box-sizing: border-box !important;
    font-family: "Cairo", sans-serif;

}



/* منع أي flex أو grid من ملف style-v3 إنه يأثر على الصفحة */
.contact-card {
  width: 100%;
  max-width: 900px;  
  margin: 0 auto 100px;
  background: #fff;
  padding: 40px;
  border-radius: 10px;
  box-sizing: border-box;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
}


/* أزرار الفورم + Join/Hire */
button { 
    background: var(--btn-bg); 
    color:#0b2a4a; 
    border:none; 
    padding:14px 28px; 
    font-size:15px; 
    font-weight:500;
    cursor:pointer; 
    border-radius:6px;
    transition: all 0.25s ease; 
    font-family: "Cairo", sans-serif;

}

button:hover { 
    background: var(--btn-hover);         
    transform: scale(1.05);    
}

/* زر إرسال الفورم */
form button {
    background: var(--btn-bg);      
    color:#0b2a4a;
    width:100%;
    font-weight:600;
}

form button:hover {
    background: var(--btn-hover);         
    transform: scale(1.03);  
}

input, textarea {
    width:100%;
    padding:10px 12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
    font-weight:400;
}

textarea { resize:vertical; min-height:100px; }

.notice { 
    background:#1e1e1e; 
    color:#d6d6d6; 
    padding:18px 22px; 
    border-radius:6px; 
    font-size:14px; 
    line-height:1.7; 
    margin-top:16px; 
    border-right:3px solid #444;
}

.modal {
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:var(--modal-bg);
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:20px;
}

.modal-content {
    background:#fff;
    padding:30px;
    border-radius:8px;
    max-width:600px;
    width:100%;
    text-align:right;
    transform: scale(0.7);
    transition: all 0.25s ease;
    position: relative;
}

.modal.show .modal-content { transform: scale(1); }

.modal-close {
    position:absolute;
    top:15px;
    left:15px;
    font-size:18px;
    cursor:pointer;
}

.flex-buttons {
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:40px;
}

.flex-buttons button {
    flex:1 1 200px;
}

/* Floating Social Vertical */
.social-floating {
    position:fixed;
    bottom:25px;
    left:25px;
    display:flex;
    flex-direction:column;
    gap:15px;
    z-index:9999;
}

.social-floating a {
    display:flex;
    align-items:center;
    justify-content:center;
    width:55px;  
    height:55px;
    border-radius:50%;
    color:#fff;
    text-decoration:none;
    font-weight:500;
    transition: all 0.25s ease, box-shadow 0.3s ease;
}

.social-floating a:hover {
    transform: scale(1.15);
    box-shadow: 0 0 15px 3px var(--icon-glow);
}

/* Colors */
#whatsappBtn { background: var(--whatsapp-color); }
#facebookBtn { background: var(--facebook-color); }
#instagramBtn { background: var(--instagram-color); }

.social-floating img {
    width:32px; /* تكبير اللوجو داخل الدائرة */
    height:32px;
}

/* Responsive */
@media(max-width:600px){
    body{font-size:13px;}
    header h1{font-size:22px;}
}


/* Join Modal Fix */
#joinModal .modal-content {
  max-width: 420px;
  width: 100%;
  padding: 25px;
  box-sizing: border-box;
}

#joinModal .field {
  width: 100%;
}

#joinModal input,
#joinModal textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 10px 12px;
}


.join-card input,
.join-card select,
.join-card textarea {
  width: 100%;
  padding: 10px 12px;
  margin-bottom: 14px;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-size: 14px;
}

:root{
  --contact-nav-h: 90px; /* هيتعدل تلقائيًا بالـ JS */
}

/* 1) ثبّت حاوية حقن الهيدر */
body.contact-page #header{
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  width: 100% !important;
  z-index: 999999 !important;
  transform: none !important;
  transition: none !important;
}

/* 2) الهيدر نفسه */
body.contact-page #header header.navbar{
  width: 100% !important;
  transform: none !important;
  transition: none !important;
  animation: none !important;
  background: #0b2a4a !important; /* نفس لونك */
  box-shadow: 0 10px 25px rgba(0,0,0,0.12) !important;
}

/* 3) تجاهل hide/scrolled/sticky في الصفحة دي */
body.contact-page #header header.navbar.scrolled,
body.contact-page #header header.navbar.sticky,
body.contact-page #header header.navbar.hide,
body.contact-page #header header.navbar.is-hidden,
body.contact-page #header header.navbar[class*="hide"],
body.contact-page #header header.navbar[class*="hidden"]{
  transform: none !important;
  top: 0 !important;
  opacity: 1 !important;
  visibility: visible !important;
}

/* 4) ألوان النص والأيقونات */
body.contact-page #header header.navbar a,
body.contact-page #header header.navbar span,
body.contact-page #header header.navbar button{
  color:#fff !important;
}
body.contact-page #header header.navbar .nav-toggle span{
  background:#fff !important;
}

/* 5) خلي المحتوى يبدأ بعد الهيدر */
body.contact-page .contact-hero{
  margin-top: var(--contact-nav-h) !important;
}

/* ✅ Mobile: اقفل أي حركة للهيدر نهائياً */
@media (max-width: 768px){
  body.contact-page #header,
  body.contact-page #header header.navbar{
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    transform: none !important;
    transition: none !important;
    animation: none !important;
    will-change: auto !important;
  }

  /* لو سكربت بيضيف كلاسّات الحركة */
  body.contact-page #header header.navbar.scrolled,
  body.contact-page #header header.navbar.sticky,
  body.contact-page #header header.navbar.hide,
  body.contact-page #header header.navbar.is-hidden{
    transform: none !important;
    top: 0 !important;
    opacity: 1 !important;
    visibility: visible !important;
  }
}
html, body{
  margin: 0 !important;
  padding: 0 !important;
  overflow-x: hidden;
}

/* بدل ما hero ياخد margin-top */
body.contact-page{
  padding-top: 0 !important;
  scroll-padding-top: 0 !important;
}

/* لو موجودة عندك خليهـا تلغي أي margin-top للـ hero */
body.contact-page .contact-hero{
  margin-top: 0 !important;
}
body.contact-page #header{
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  width: 100% !important;
  z-index: 999999 !important;
  transform: none !important;
  transition: none !important;
  will-change: auto !important;
}

body.contact-page #header *{
  transition: none !important;
}


</style>

<script>
function openModal(id){
    document.getElementById(id).style.display='flex';
    document.getElementById(id).classList.add('show');
}
function closeModal(id){
    document.getElementById(id).style.display='none';
    document.getElementById(id).classList.remove('show');
}
</script>
</head>

<body class="contact-page">
<div id="header"></div>


<script>
  function initHeader(){
    const navbar = document.querySelector("header.navbar");
    if(!navbar) return;

    const navBtn = document.getElementById("navToggle");
    const closeMenu = document.getElementById("closeMenu");

    const openSearch = document.getElementById("openSearch");
    const overlay = document.getElementById("searchOverlay");
    const closeSearch = document.getElementById("closeSearch");
    const input = document.getElementById("searchInput");
    
    

    // فتح/قفل المنيو
    if(navBtn){
      navBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        navbar.classList.toggle("open");
        navBtn.setAttribute("aria-expanded", navbar.classList.contains("open") ? "true" : "false");
      });
    }

    if(closeMenu){
      closeMenu.addEventListener("click", () => {
        navbar.classList.remove("open");
        navBtn?.setAttribute("aria-expanded","false");
      });
    }

    // اقفل المنيو لما تدوس بره
    document.addEventListener("click", (e) => {
      const nav = document.getElementById("mainNav");
      if(!nav) return;
      if(navbar.classList.contains("open") && !nav.contains(e.target) && e.target !== navBtn){
        navbar.classList.remove("open");
        navBtn?.setAttribute("aria-expanded","false");
      }
    });

    // =========================
    // =========================
// MOBILE: dropdown click accordion (ONLY)
// =========================
const isMobile = window.matchMedia("(max-width: 900px)");

function bindMobileDropdowns(){
  const nav = document.getElementById("mainNav");
  if(!nav) return;

  const dropdowns = nav.querySelectorAll(":scope > .dropdown");

  function closeAll(except){
    dropdowns.forEach(dd=>{
      if(dd !== except){
        dd.classList.remove("is-open");
        const t = dd.querySelector(":scope > span");
        t && t.setAttribute("aria-expanded","false");
      }
    });
  }

  dropdowns.forEach(dd=>{
    const trigger = dd.querySelector(":scope > span");
    const menu = dd.querySelector(":scope > .dropdown-menu");
    if(!trigger || !menu) return;

    trigger.setAttribute("role","button");
    trigger.setAttribute("tabindex","0");
    trigger.setAttribute("aria-expanded","false");

    const toggle = (e)=>{
      if(!isMobile.matches) return;
      e.preventDefault();
      e.stopPropagation();

      const open = dd.classList.contains("is-open");
      closeAll(dd);

      if(open){
        dd.classList.remove("is-open");
        trigger.setAttribute("aria-expanded","false");
      }else{
        dd.classList.add("is-open");
        trigger.setAttribute("aria-expanded","true");
      }
    };

    trigger.addEventListener("click", toggle);
    trigger.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" || e.key === " "){ toggle(e); }
    });
  });
}

bindMobileDropdowns();




    // البحث Overlay
    if(openSearch && overlay && closeSearch && input){
      openSearch.addEventListener("click", (e) => {
        e.stopPropagation();
        navbar.classList.remove("open");
        navbar.classList.add("search-open");
        overlay.setAttribute("aria-hidden","false");
        setTimeout(()=>input.focus(), 50);
      });

      function closeIt(){
        input && input.blur();                 // ✅ شيل الفوكس من input
        navbar.classList.remove("search-open");
        overlay.setAttribute("aria-hidden","true");
        input && (input.value = "");
      }



      closeSearch.addEventListener("click", closeIt);
      overlay.addEventListener("click", (e)=>{ if(e.target===overlay) closeIt(); });
      document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeIt(); });
    }
  }

  let _lockTimer;

function lockMobilePinnedHeader(){
  if(!window.matchMedia("(max-width: 768px)").matches) return;

  const host = document.getElementById("header");
  const navbar = host?.querySelector("header.navbar");
  if(!host || !navbar) return;

  // اقفل أي تحريك على الكونتينر نفسه
  host.style.position = "fixed";
  host.style.top = "0";
  host.style.left = "0";
  host.style.right = "0";
  host.style.width = "100%";
  host.style.transform = "none";
  host.style.transition = "none";

  // اقفل أي تحريك على الهيدر
  navbar.classList.remove("hide","is-hidden","scrolled","sticky");
  navbar.style.position = "fixed";
  navbar.style.top = "0";
  navbar.style.left = "0";
  navbar.style.right = "0";
  navbar.style.width = "100%";
  navbar.style.transform = "none";
  navbar.style.transition = "none";

  // احسب ارتفاعه واعمل padding للجسم (زي الخصوصية)
  const h = Math.ceil(navbar.getBoundingClientRect().height || 80);
  document.documentElement.style.setProperty("--contact-nav-h", h + "px");
  document.body.style.paddingTop = h + "px";

  // “قفل إضافي” بعد أي سكربت تاني يحاول يغيره
  clearTimeout(_lockTimer);
  _lockTimer = setTimeout(() => {
    navbar.classList.remove("hide","is-hidden","scrolled","sticky");
    navbar.style.transform = "none";
    host.style.transform = "none";
  }, 50);
}

  fetch("components/header.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("header").innerHTML = html;
    initHeader();
    lockMobilePinnedHeader();
    window.addEventListener("resize", lockMobilePinnedHeader);
    window.addEventListener("orientationchange", lockMobilePinnedHeader);
    window.addEventListener("scroll", lockMobilePinnedHeader, { passive:true }); // ✅ يقفل أي حركة لو سكربت تاني بيحركه
  });

</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>  تصوير أفراح events - Another World Photography</title>
  <link rel="stylesheet" href="css/style-v3.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&display=swap" rel="stylesheet">

<style>
/* الهيرو */
.events-hero {
    position: relative;
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: none;
}

/* Overlay */
.events-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.18);
    z-index: 1;
}

/* العنوان */
.events-hero h1 {
    position: relative;
    z-index: 2;
    font-family: 'Montserrat', sans-serif;
    font-size: 5rem;
    font-weight: 600;
    color: white;
    margin-bottom: 140px;
    letter-spacing: 0px;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.100);
}

/* أزرار Next/Prev */
.events-prev,
.events-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    width: 60px;
    height: 60px;
    background: rgba(0,0,0,0.4);
    border: none;
    border-radius: 8px;
    font-size: 32px;
    color: white;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

.events-prev { left: 40px; }
.events-next { right: 40px; }

/* Dots */
.events-dots {
    position: absolute;
    bottom: 40px;
    display: flex;
    gap: 12px;
    z-index: 3;
}

.events-dots .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    cursor: pointer;
    transition: 0.2s;
}

.events-dots .dot.active {
    background: white;
    transform: scale(1.2);
}

/* Hover */
.events-prev:hover,
.events-next:hover {
    background: rgba(255,255,255,0.6);
    color: black;
    transform: translateY(-50%) scale(1.15);
}

/* ===== LIGHTBOX — events Only ===== */
.events-lightbox {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: opacity .3s ease;
}

.events-lightbox.active {
  display: flex;
  opacity: 1;
}

.events-content {
  position: relative;
  max-width: 90%;
  max-height: 90%;
}

.events-img {
  max-width: 100%;
  max-height: 85vh;
  border-radius: 8px;
}

.events-info {
  text-align: center;
  color: #fff;
  margin-top: 10px;
}

.events-author {
  font-size: 1.3rem;
  font-weight: 600;
}

/* Close button */
.events-close {
  position: absolute;
  top: 20px;
  right: 20px;
  background: none;
  border: none;
  color: white;
  font-size: 3rem;
  cursor: pointer;
}

/* Navigation arrows */
.events-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  font-size: 2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.events-prev { left: 20px; }
.events-next { right: 20px; }

.latest-works {
  min-height: 800px; }
  
  .hidden {
    display: none !important;
}


</style>
</head>

<body class="about-body">

<!-- HEADER -->
<div id="header"></div>
<script>
  fetch("components/header.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("header").innerHTML = data;
    });
</script>

<!-- HERO -->
<section class="gallery-hero events-hero">
    <div class="events-overlay"></div>
    <h1>EVENTS</h1>

    <button class="events-prev prev" id="events-prev">›</button>
    <button class="events-next next" id="events-next">‹</button>
    <div class="events-dots"></div>
</section>

<script src="js/events-slider.js"></script>

<!-- LIGHTBOX HTML -->
<div class="events-lightbox" id="eventsLightbox">
    <button class="events-close" id="eventsClose">&times;</button>
    <button class="events-nav events-prev" id="eventsPrev">›</button>
    <button class="events-nav events-next" id="eventsNext">‹</button>
    <div class="events-content">
        <img class="events-img" id="eventsImg" src="" alt="">
        <div class="events-info">
            <div class="events-author" id="eventsAuthor"></div>
        </div>
    </div>
</div>

<!-- LIGHTBOX SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const events = document.getElementById('eventsLightbox');
  const eventsImg = document.getElementById('eventsImg');
  const eventsAuthor = document.getElementById('eventsAuthor');
  const eventsClose = document.getElementById('eventsClose');
  const eventsPrev = document.getElementById('eventsPrev');
  const eventsNext = document.getElementById('eventsNext');
  window.openevents = function(photo, index) {
      eventsImg.src = photo.image;
      eventsAuthor.textContent = photo.author;
      events.classList.add('active');
      document.body.style.overflow = 'hidden';
      events.dataset.index = index;
  }

  function closeevents() {
      events.classList.remove('active');
      document.body.style.overflow = 'auto';
  }

  function navevents(dir) {
      let idx = parseInt(events.dataset.index);
      if (dir === 'next') idx = (idx + 1) % eventsPhotos.length;
      else idx = (idx - 1 + eventsPhotos.length) % eventsPhotos.length;

      const photo = eventsPhotos[idx];
      eventsImg.src = photo.image;
      eventsAuthor.textContent = photo.author;
      events.dataset.index = idx;
  }

  eventsClose.onclick = closeevents;
  eventsPrev.onclick = () => navevents('prev');
  eventsNext.onclick = () => navevents('next');

  document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeevents();
  });
});
</script>

<!-- GALLERY -->
<section class="latest-works">
    <div class="section-header">
      <h2>Events Gallery</h2>
      <p>أبرز صور الأفراح والمناسبات  من مجتمعنا</p>
    </div>

    <div class="photo-grid" id="photo-grid"></div>

    <button id="load-more-btn" class="load-more-btn hidden">More</button>
</section>

<!-- GALLERY SCRIPT -->
<script src="js/events-gallery.js"></script>

<!-- الفوتر -->
 <div id="footer"></div>
<script>
  fetch("components/footer.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
    });
</script>

<!-- HEADER SCROLL -->
<script>
  window.addEventListener("scroll", function () {
    const navbar = document.querySelector(".navbar");
    if (window.scrollY > 50) {
      navbar.classList.add("scrolled");
    } else {
      navbar.classList.remove("scrolled");
    }
  });
</script>

</body>
</html>

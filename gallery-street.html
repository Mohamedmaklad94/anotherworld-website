<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>  صور الشارع street photography - Another World Photography</title>
  <link rel="stylesheet" href="css/style-v3.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
/* الهيرو */
.street-hero {
    position: relative;
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: none;
}

/* Overlay */
.street-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.18);
    z-index: 1;
}

/* العنوان */
.street-hero h1 {
    position: relative;
    z-index: 2;
    font-family: 'Montserrat', sans-serif;
    font-size: 5rem;
    font-weight: 600;
    color: white;
    margin-bottom: 140px;
    letter-spacing: 0px;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.100);
}

/* أزرار Next/Prev */
.street-prev,
.street-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    width: 60px;
    height: 60px;
    background: rgba(0,0,0,0.4);
    border: none;
    border-radius: 8px;
    font-size: 32px;
    color: white;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

.street-prev { left: 40px; }
.street-next { right: 40px; }

/* Dots */
.street-dots {
    position: absolute;
    bottom: 40px;
    display: flex;
    gap: 12px;
    z-index: 3;
}

.street-dots .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    cursor: pointer;
    transition: 0.2s;
}

.street-dots .dot.active {
    background: white;
    transform: scale(1.2);
}

/* Hover */
.street-prev:hover,
.street-next:hover {
    background: rgba(255,255,255,0.6);
    color: black;
    transform: translateY(-50%) scale(1.15);
}

/* ===== LIGHTBOX — street Only ===== */
.street-lightbox {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: opacity .3s ease;
}

.street-lightbox.active {
  display: flex;
  opacity: 1;
}

.street-content {
  position: relative;
  max-width: 90%;
  max-height: 90%;
}

.street-img {
  max-width: 100%;
  max-height: 85vh;
  border-radius: 8px;
}

.street-info {
  text-align: center;
  color: #fff;
  margin-top: 10px;
}

.street-author {
  font-size: 1.3rem;
  font-weight: 600;
}

/* Close button */
.street-close {
  position: absolute;
  top: 20px;
  right: 20px;
  background: none;
  border: none;
  color: white;
  font-size: 3rem;
  cursor: pointer;
}

/* Navigation arrows */
.street-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  font-size: 2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.street-prev { left: 20px; }
.street-next { right: 20px; }

.latest-works {
  min-height: 800px; }
  
  .hidden {
    display: none !important;
}


</style>
</head>

<body class="about-body">

<!-- HEADER -->
<div id="header"></div>
<script>
  fetch("components/header.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("header").innerHTML = data;
    });
</script>

<!-- HERO -->
<section class="gallery-hero street-hero">
    <div class="street-overlay"></div>
    <h1>STREET</h1>

    <button class="street-prev prev" id="street-prev">›</button>
    <button class="street-next next" id="street-next">‹</button>
    <div class="street-dots"></div>
</section>

<script src="js/street-slider.js"></script>

<!-- LIGHTBOX HTML -->
<div class="street-lightbox" id="streetLightbox">
    <button class="street-close" id="streetClose">&times;</button>
    <button class="street-nav street-prev" id="streetPrev">›</button>
    <button class="street-nav street-next" id="streetNext">‹</button>
    <div class="street-content">
        <img class="street-img" id="streetImg" src="" alt="">
        <div class="street-info">
            <div class="street-author" id="streetAuthor"></div>
        </div>
    </div>
</div>

<!-- LIGHTBOX SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const street = document.getElementById('streetLightbox');
  const streetImg = document.getElementById('streetImg');
  const streetAuthor = document.getElementById('streetAuthor');
  const streetClose = document.getElementById('streetClose');
  const streetPrev = document.getElementById('streetPrev');
  const streetNext = document.getElementById('streetNext');
  window.openstreet = function(photo, index) {
      streetImg.src = photo.image;
      streetAuthor.textContent = photo.author;
      street.classList.add('active');
      document.body.style.overflow = 'hidden';
      street.dataset.index = index;
  }

  function closestreet() {
      street.classList.remove('active');
      document.body.style.overflow = 'auto';
  }

  function navstreet(dir) {
      let idx = parseInt(street.dataset.index);
      if (dir === 'next') idx = (idx + 1) % streetPhotos.length;
      else idx = (idx - 1 + streetPhotos.length) % streetPhotos.length;

      const photo = streetPhotos[idx];
      streetImg.src = photo.image;
      streetAuthor.textContent = photo.author;
      street.dataset.index = idx;
  }

  streetClose.onclick = closestreet;
  streetPrev.onclick = () => navstreet('prev');
  streetNext.onclick = () => navstreet('next');

  document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closestreet();
  });
});
</script>

<!-- GALLERY -->
<section class="latest-works">
    <div class="section-header">
      <h2>Street Gallery</h2>
      <p>أبرز صور الشارع من مجتمعنا</p>
    </div>

    <div class="photo-grid" id="photo-grid"></div>

    <button id="load-more-btn" class="load-more-btn hidden">More</button>
</section>

<!-- GALLERY SCRIPT -->
<script src="js/street-gallery.js"></script>

<!-- الفوتر -->
 <div id="footer"></div>
<script>
  fetch("components/footer.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
    });
</script>

<!-- HEADER SCROLL -->
<script>
  window.addEventListener("scroll", function () {
    const navbar = document.querySelector(".navbar");
    if (window.scrollY > 50) {
      navbar.classList.add("scrolled");
    } else {
      navbar.classList.remove("scrolled");
    }
  });
</script>

</body>
</html>

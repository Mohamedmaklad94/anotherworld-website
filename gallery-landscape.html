<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>  طبيعة landscape - Another World Photography</title>
  <link rel="stylesheet" href="css/style-v3.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
/* الهيرو */
.landscape-hero {
    position: relative;
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: none;
}

/* Overlay */
.landscape-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.18);
    z-index: 1;
}

/* العنوان */
.landscape-hero h1 {
    position: relative;
    z-index: 2;
    font-family: 'Montserrat', sans-serif;
    font-size: 5rem;
    font-weight: 600;
    color: white;
    margin-bottom: 140px;
    letter-spacing: -3.5px;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.300);
}

/* أزرار Next/Prev */
.landscape-prev,
.landscape-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    width: 60px;
    height: 60px;
    background: rgba(0,0,0,0.4);
    border: none;
    border-radius: 8px;
    font-size: 32px;
    color: white;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

.landscape-prev { left: 40px; }
.landscape-next { right: 40px; }

/* Dots */
.landscape-dots {
    position: absolute;
    bottom: 40px;
    display: flex;
    gap: 12px;
    z-index: 3;
}

.landscape-dots .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    cursor: pointer;
    transition: 0.2s;
}

.landscape-dots .dot.active {
    background: white;
    transform: scale(1.2);
}

/* Hover */
.landscape-prev:hover,
.landscape-next:hover {
    background: rgba(255,255,255,0.6);
    color: black;
    transform: translateY(-50%) scale(1.15);
}

/* ===== LIGHTBOX — landscape Only ===== */
.landscape-lightbox {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: opacity .3s ease;
}

.landscape-lightbox.active {
  display: flex;
  opacity: 1;
}

.landscape-content {
  position: relative;
  max-width: 90%;
  max-height: 90%;
}

.landscape-img {
  max-width: 100%;
  max-height: 85vh;
  border-radius: 8px;
}

.landscape-info {
  text-align: center;
  color: #fff;
  margin-top: 10px;
}

.landscape-author {
  font-size: 1.3rem;
  font-weight: 600;
}

/* Close button */
.landscape-close {
  position: absolute;
  top: 20px;
  right: 20px;
  background: none;
  border: none;
  color: white;
  font-size: 3rem;
  cursor: pointer;
}

/* Navigation arrows */
.landscape-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  font-size: 2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.landscape-prev { left: 20px; }
.landscape-next { right: 20px; }

.latest-works {
  min-height: 800px; }
  
  .hidden {
    display: none !important;
}


</style>
</head>

<body class="about-body">

<!-- HEADER -->
<div id="header"></div>
<script>
  fetch("components/header.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("header").innerHTML = data;
    });
</script>

<!-- HERO -->
<section class="gallery-hero landscape-hero">
    <div class="landscape-overlay"></div>
    <h1>LANDSCAPE</h1>

    <button class="landscape-prev prev" id="landscape-prev">›</button>
    <button class="landscape-next next" id="landscape-next">‹</button>
    <div class="landscape-dots"></div>
</section>

<script src="js/landscape-slider.js"></script>

<!-- LIGHTBOX HTML -->
<div class="landscape-lightbox" id="landscapeLightbox">
    <button class="landscape-close" id="landscapeClose">&times;</button>
    <button class="landscape-nav landscape-prev" id="landscapePrev">›</button>
    <button class="landscape-nav landscape-next" id="landscapeNext">‹</button>
    <div class="landscape-content">
        <img class="landscape-img" id="landscapeImg" src="" alt="">
        <div class="landscape-info">
            <div class="landscape-author" id="landscapeAuthor"></div>
        </div>
    </div>
</div>

<!-- LIGHTBOX SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const landscape = document.getElementById('landscapeLightbox');
  const landscapeImg = document.getElementById('landscapeImg');
  const landscapeAuthor = document.getElementById('landscapeAuthor');
  const landscapeClose = document.getElementById('landscapeClose');
  const landscapePrev = document.getElementById('landscapePrev');
  const landscapeNext = document.getElementById('landscapeNext');
  window.openlandscape = function(photo, index) {
      landscapeImg.src = photo.image;
      landscapeAuthor.textContent = photo.author;
      landscape.classList.add('active');
      document.body.style.overflow = 'hidden';
      landscape.dataset.index = index;
  }

  function closelandscape() {
      landscape.classList.remove('active');
      document.body.style.overflow = 'auto';
  }

  function navlandscape(dir) {
      let idx = parseInt(landscape.dataset.index);
      if (dir === 'next') idx = (idx + 1) % landscapePhotos.length;
      else idx = (idx - 1 + landscapePhotos.length) % landscapePhotos.length;

      const photo = landscapePhotos[idx];
      landscapeImg.src = photo.image;
      landscapeAuthor.textContent = photo.author;
      landscape.dataset.index = idx;
  }

  landscapeClose.onclick = closelandscape;
  landscapePrev.onclick = () => navlandscape('prev');
  landscapeNext.onclick = () => navlandscape('next');

  document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closelandscape();
  });
});
</script>

<!-- GALLERY -->
<section class="latest-works">
    <div class="section-header">
      <h2>Landscape Gallery</h2>
      <p>أبرز صور الطبيعة  من مجتمعنا</p>
    </div>

    <div class="photo-grid" id="photo-grid"></div>

    <button id="load-more-btn" class="load-more-btn hidden">More</button>
</section>

<!-- GALLERY SCRIPT -->
<script src="js/landscape-gallery.js"></script>

<!-- الفوتر -->
 <div id="footer"></div>
<script>
  fetch("components/footer.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
    });
</script>

<!-- HEADER SCROLL -->
<script>
  window.addEventListener("scroll", function () {
    const navbar = document.querySelector(".navbar");
    if (window.scrollY > 50) {
      navbar.classList.add("scrolled");
    } else {
      navbar.classList.remove("scrolled");
    }
  });
</script>

</body>
</html>

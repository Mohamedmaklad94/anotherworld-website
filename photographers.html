/* =========================================================
   RESPONSIVE PACK (MOBILE + TABLET ONLY)
   Works ONLY under 980px — desktop stays untouched
   Paste at the very end of <style>

@media (max-width: 980px){

  /* 0) Safety ضد أي overflow أفقي */

  *{ box-sizing: border-box; }
  img{ max-width:100%; display:block; }

  /* 1) قلل padding اللي بيخنق المساحة */

    padding: 0 14px !important;
    width: 100% !important;
  }

  /* 2) الجريد: تابلت = 2 أعمدة (من غير كروت عريضة) */

    display:grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 14px !important;

  /* 3) الكارت ما يفرضش عرض/ارتفاع غريب */

    min-width: 0 !important;
    width: 100% !important;
  }
  .ph-card--mosaic{

    gap: 6px !important;

  .ph-mosaic img{

    object-fit: cover !important;
  }

  /* 5) الأفاتار والـ badge ما يركبوش على بعض */
  .ph-card--mosaic{ position: relative !important; }

  /* خليك محافظ على البادج في الركن فوق (لو موجود) */

    top: 10px !important;
    right: 10px !important;
    z-index: 5 !important;

  }

  /* الأفاتار في النص دايمًا */
  .ph-card-body{ text-align:center !important; padding: 10px 12px 14px !important; }
  .ph-avatar{
    width: 54px !important;
    height: 54px !important;
    margin-top: -26px !important;
    margin-left:auto !important;
    margin-right:auto !important;

  /* 6) النصوص */
  .ph-name{ font-size: .98rem !important; margin: 10px 0 2px !important; }
  .ph-location{ font-size: .82rem !important; margin-bottom: 8px !important; }

  /* 7) Tags: سطر واحد Scroll أفقي */
  .ph-tags{
    display:flex !important;
    flex-wrap: nowrap !important;
    overflow-x: auto !important;
    overflow-y: hidden !important;
    gap: 6px !important;
    justify-content: center !important;
    padding-bottom: 6px !important;
    margin-bottom: 10px !important;
    scrollbar-width: none !important;
  }
  .ph-tags::-webkit-scrollbar{ display:none; }
  .ph-tag{
    white-space: nowrap !important;
    flex: 0 0 auto !important;
    font-size: .72rem !important;
    padding: 3px 9px !important;
  }

  /* 8) الأزرار: FIX نهائي للنص داخل الزر + يمنع أي overlap */

  }
  .ph-view, .ph-book{

}


/* =========================================================
   MOBILE SMALL (<= 420px)
   ========================================================= */
@media (max-width: 420px){

<script>
  function initHeader(){
    const navbar = document.querySelector("header.navbar");
    if(!navbar) return;

    const navBtn = document.getElementById("navToggle");
    const closeMenu = document.getElementById("closeMenu");

    const openSearch = document.getElementById("openSearch");
    const overlay = document.getElementById("searchOverlay");
    const closeSearch = document.getElementById("closeSearch");
    const input = document.getElementById("searchInput");

    // فتح/قفل المنيو
    if(navBtn){
      navBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        navbar.classList.toggle("open");
        navBtn.setAttribute("aria-expanded", navbar.classList.contains("open") ? "true" : "false");
      });
    }

    if(closeMenu){
      closeMenu.addEventListener("click", () => {
        navbar.classList.remove("open");
        navBtn?.setAttribute("aria-expanded","false");
      });
    }

    // اقفل المنيو لما تدوس بره
    document.addEventListener("click", (e) => {
      const nav = document.getElementById("mainNav");
      if(!nav) return;
      if(navbar.classList.contains("open") && !nav.contains(e.target) && e.target !== navBtn){
        navbar.classList.remove("open");
        navBtn?.setAttribute("aria-expanded","false");
      }
    });

    // =========================
    // =========================
// MOBILE: dropdown click accordion (ONLY)
// =========================
const isMobile = window.matchMedia("(max-width: 900px)");

function bindMobileDropdowns(){
  const nav = document.getElementById("mainNav");
  if(!nav) return;

  const dropdowns = nav.querySelectorAll(":scope > .dropdown");

  function closeAll(except){
    dropdowns.forEach(dd=>{
      if(dd !== except){
        dd.classList.remove("is-open");
        const t = dd.querySelector(":scope > span");
        t && t.setAttribute("aria-expanded","false");
      }
    });
  }

  dropdowns.forEach(dd=>{
    const trigger = dd.querySelector(":scope > span");
    const menu = dd.querySelector(":scope > .dropdown-menu");
    if(!trigger || !menu) return;

    trigger.setAttribute("role","button");
    trigger.setAttribute("tabindex","0");
    trigger.setAttribute("aria-expanded","false");

    const toggle = (e)=>{
      if(!isMobile.matches) return;
      e.preventDefault();
      e.stopPropagation();

      const open = dd.classList.contains("is-open");
      closeAll(dd);

      if(open){
        dd.classList.remove("is-open");
        trigger.setAttribute("aria-expanded","false");
      }else{
        dd.classList.add("is-open");
        trigger.setAttribute("aria-expanded","true");
      }
    };

    trigger.addEventListener("click", toggle);
    trigger.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" || e.key === " "){ toggle(e); }
    });
  });
}

bindMobileDropdowns();




    // البحث Overlay
    if(openSearch && overlay && closeSearch && input){
      openSearch.addEventListener("click", (e) => {
        e.stopPropagation();
        navbar.classList.remove("open");
        navbar.classList.add("search-open");
        overlay.setAttribute("aria-hidden","false");
        setTimeout(()=>input.focus(), 50);
      });

      function closeIt(){
        input && input.blur();                 // ✅ شيل الفوكس من input
        navbar.classList.remove("search-open");
        overlay.setAttribute("aria-hidden","true");
        input && (input.value = "");
      }



      closeSearch.addEventListener("click", closeIt);
      overlay.addEventListener("click", (e)=>{ if(e.target===overlay) closeIt(); });
      document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeIt(); });
    }
  }

  function lockMobilePinnedHeader(){
  const isMobile = window.matchMedia("(max-width: 768px)").matches;
  if(!isMobile) return;

  const host = document.getElementById("header");
  const navbar = host?.querySelector("header.navbar");
  if(!host || !navbar) return;

  // امسح أي آثار من سكربت السكرول
  navbar.classList.remove("hide","is-hidden","scrolled");

  // احسب الارتفاع الحقيقي واعمله padding-top للجسم
  const h = Math.ceil(navbar.getBoundingClientRect().height || 64);
  document.documentElement.style.setProperty("--nav-h", h + "px");
  document.body.style.paddingTop = h + "px";
}

  fetch("components/header.html")
    .then(r => r.text())
    .then(html => {
      document.getElementById("header").innerHTML = html;
      initHeader();
      lockMobilePinnedHeader();   // ✅ تثبيت الموبايل
      window.addEventListener("resize", lockMobilePinnedHeader);
      window.addEventListener("orientationchange", lockMobilePinnedHeader);


    });
</script>




<!-- السكرول  -->
<script>
  // DESKTOP ONLY: scrolled header
  (function(){
    const mq = window.matchMedia("(max-width: 768px)");
    function onScroll(){
      const navbar = document.querySelector("header.navbar");
      if(!navbar) return;
      if (window.scrollY > 50) navbar.classList.add("scrolled");
      else navbar.classList.remove("scrolled");
    }

    function bind(){
      // لو موبايل: شيل scrolled واقفل التأثير
      if(mq.matches){
        const navbar = document.querySelector("header.navbar");
        navbar && navbar.classList.remove("scrolled");
        window.removeEventListener("scroll", onScroll);
        return;
      }
      // لو ديسكتوب: شغل
      window.addEventListener("scroll", onScroll, { passive:true });
      onScroll();
    }

    // أول مرة + عند تغيير المقاس
    bind();
    mq.addEventListener?.("change", bind);
  })();
</script>

  ];

  const els = {
    grid: document.getElementById("phGrid"),
    empty: document.getElementById("phEmpty"),
    count: document.getElementById("phCount"),
    search: document.getElementById("phSearch"),
    cat: document.getElementById("phCategory"),
    country: document.getElementById("phCountry"),
    featured: document.getElementById("phFeatured"),
    gov: document.getElementById("phGov"),
    bookable: document.getElementById("phBookable"),
  };

  function normalize(s){
    return (s || "")
      .toString()
      .toLowerCase()
      .trim();
  }

  function render(items){
  els.grid.innerHTML = items.map(p => {
    const locLabel = (p.country === "EG")
    ? (p.governorateAr || p.governorate || p.city)
    : (p.city);

    const loc = [countryAr[p.country] || p.country, locLabel].filter(Boolean).join(" - ");

    const tags = (p.specialties || [])
      .slice(0,5)
      .map(t => `<span class="ph-tag">${categoryAr[t] || t}</span>`)
      .join("");

    const badge = p.featured ? `<span class="ph-badge">مميز</span>` : "";
    const link = `photographer.html?u=${encodeURIComponent(p.username)}`;

    const t = p.thumbs || [];
    const t0 = t[0] || p.avatar;
    const t1 = t[1] || p.avatar;
    const t2 = t[2] || p.avatar;
    const t3 = t[3] || p.avatar;

    return `
      <article class="ph-card ph-card--mosaic">
        <div class="ph-mosaic" aria-hidden="true">
          <img src="${t0}" alt="" loading="lazy">
          <img src="${t1}" alt="" loading="lazy">
          <img src="${t2}" alt="" loading="lazy">
          <img src="${t3}" alt="" loading="lazy">
        </div>

        <div class="ph-card-body">
          ${badge}
          <img class="ph-avatar" src="${p.avatar}" alt="صورة ${p.name}" loading="lazy">

          <h3 class="ph-name">${p.name}</h3>
          <p class="ph-location">${loc || "—"}</p>

          <div class="ph-tags">${tags}</div>

          <div class="ph-actions">
            <a class="ph-view" href="${link}">
              عرض الملف <i class="fa-solid fa-arrow-left"></i>
            </a>
           ${p.bookable ? `
           <a class="ph-book" href="main-booking.html?photographer=${encodeURIComponent(p.username)}">
            احجز
           </a>
           ` : ``}

          </div>
        </div>
      </article>
    `;
  }).join("");

  els.count.textContent = items.length.toString();
  els.empty.hidden = items.length !== 0;
}


  // اربط عنصر المحافظات
  const phGov = document.getElementById("phGov");

  // ابني الخيارات مرة واحدة
  function buildGovOptions(){
    if(!phGov) return;
    phGov.innerHTML = `<option value="">كل المحافظات</option>` + 
      EGYPT_GOVS.map(g => `<option value="${g.v}">${g.t}</option>`).join("");
  }
  buildGovOptions();

  function toggleGov(){
    if(!phGov) return;

    const isEgypt = els.country.value === "EG";
    if(isEgypt){
      phGov.hidden = false;
      phGov.disabled = false;
    }else{
      phGov.value = "";
      phGov.hidden = true;
      phGov.disabled = true;
    }
  }

  // نادِها أول ما الصفحة تفتح
  toggleGov();

  // لما تتغير الدولة
  els.country.addEventListener("change", () => {
    toggleGov();
    applyFilters();
  });

  // فلترة بالمحافظة (لو مصر)
  if(phGov){
    phGov.addEventListener("change", applyFilters);
  }

  function applyFilters(){
  const q = normalize(els.search.value);
  const cat = els.cat.value;
  const ctry = els.country.value;
  const feat = els.featured.checked;
  const onlyBookable = els.bookable.checked;
  const gov = (phGov && !phGov.hidden) ? phGov.value : "";

  const out = PHOTOGRAPHERS.filter(p => {
    const matchQ = !q || normalize(p.name).includes(q);
    const matchCat = !cat || (p.specialties || []).includes(cat);
    const matchCountry = !ctry || p.country === ctry;
    const matchGov = !gov || (normalize(p.governorate) === normalize(gov));
    const matchFeat = !feat || !!p.featured;
    const matchBookable = !onlyBookable || !!p.bookable;
    return matchQ && matchCat && matchCountry && matchGov && matchFeat && matchBookable;

  });

  render(out);
}


  // Bind
  ["input", "change"].forEach(evt => {
    els.search.addEventListener(evt, applyFilters);
    els.cat.addEventListener(evt, applyFilters);
    els.country.addEventListener(evt, applyFilters);
    els.featured.addEventListener(evt, applyFilters);
    els.bookable.addEventListener(evt, applyFilters);

  });

  // أول رندر
  render(PHOTOGRAPHERS);
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title> المسابقة الأسبوعية | أفضل صور الأسبوع | Another World Photography</title>
  <link rel="stylesheet" href="css/style-v3.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

html, body {
  height: 100%;
}

body.weekly {
  flex-direction: column;
    background: #dfdede;

}

#footer {
  margin-top: auto;
}



/* ====== HERO SLIDER ====== */
.weekly-slider-hero {
  position: relative;
  width: 100%;
  height: 700px;
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 2.0rem;
  font-family: "Cairo", sans-serif;
}

.weekly-slider-hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.3);
}

.weekly-slider-hero .hero-content {
  position: relative;
  z-index: 2;
  color: #fff;
}

.weekly-slider-hero .weekly-slider-dots {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 2;
}

.weekly-slider-hero .dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: rgba(255,255,255,0.5);
  cursor: pointer;
}

.weekly-slider-hero .dot.active { background: #fff; }

.weekly-slider-hero .weekly-slider-prev,
.weekly-slider-hero .weekly-slider-next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.5);
  border: none;
  color: white;
  font-size: 2rem;
  padding: 5px 10px;
  cursor: pointer;
  z-index: 2;
}

.weekly-slider-hero .weekly-slider-prev { left: 20px; }
.weekly-slider-hero .weekly-slider-next { right: 20px; }

/* ====== GALLERY ====== */
.weekly-gallery {
padding: 80px 5%!important;
background: #f5f5f5; /* خلفية فاتحة */
  color: #111;
}

.month-section {
  margin-bottom: 40px;
  border-bottom: 1px solid #ccc;
}

.month-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 2rem;
  cursor: pointer;
  margin-bottom: 10px;
}

.week-section {
  margin-left: 20px;
  margin-bottom: 20px;
  display: none;
}

.week-section.open { display: block; }

.week-title {
  font-size: 1.3rem;
  margin-bottom: 10px;
  color: #333;
  cursor: pointer;
}

.week-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
  margin-bottom: 50px;
}

.week-item {
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  cursor: pointer;
}

.week-item img {
  width: 100%;
  height: 360px;
  object-fit: cover;
  transition: transform 0.6s ease;
}

.week-item:hover img {
  transform: scale(1.1);
}

.week-overlay {
  position: absolute;
  bottom: 0;
  inset-inline: 0;
  padding: 15px;
  background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
  opacity: 0;
  transition: opacity 0.4s ease;
}

.week-overlay span {
  font-size: 1rem;
  font-weight: 500;
  color: #fff;
}

.week-item:hover .week-overlay {
  opacity: 1;
}

.week-grid {
  overflow: hidden;
}
.week-section {
  overflow: hidden;
}


.weekly-gallery:empty {
display: none;
background: #e6e6e6;

}


/* ====== LIGHTBOX ====== */
.weekly-lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.weekly-lightbox.active {
  display: flex;
}

.weekly-lightbox img {
  width: auto !important;
  height: auto !important;
  max-width: 90vw !important;
  max-height: 80vh !important;
  object-fit: contain !important;
  display: block;
  margin: auto;
}


.weekly-close,
.weekly-prev,
.weekly-next {
  position: absolute;
  background: none;
  border: none;
  color: white;
  font-size: 2.5rem;
  cursor: pointer;
  z-index: 10000;
}

.weekly-close {
  top: 20px;
  right: 30px;
}

.weekly-prev {
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
}

.weekly-next {
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
}

.weekly-info {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10000;
}

#weeklyAuthor {
  font-size: 1.6rem;
  font-weight: 700;
  color: #fff;
  padding: 8px 18px;
  /*background: rgba(0,0,0,0.55);*/
  border-radius: 8px;
  text-shadow: 0 2px 6px rgba(0,0,0,0.8);
}

.weekly-slider-prev:hover,
.weekly-slider-next:hover {
  background: #fff;
  color: #000;
 /* transform: scale(1.15);*/
}

.weekly-prev:hover,
.weekly-next:hover {
  background: #fff;
  color: #000;
}


</style>
</head>

  <body class="weekly">
  <div id="header"></div>
<script>
  fetch("components/header.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("header").innerHTML = data;
    });
</script>

<!-- HERO SLIDER -->
  <section class="weekly-slider-hero">
    <div class="hero-content">
      <h1>أفضل صور الأسبوع</h1>
    </div>
    <div class="weekly-slider-dots"></div>
   <button class="weekly-slider-prev"><i class="fas fa-chevron-left"></i></button>
<button class="weekly-slider-next"><i class="fas fa-chevron-right"></i></button>

  </section>

  <!-- WEEKLY GALLERY -->
  <section class="weekly-gallery" id="weeklyGallery"></section>

  <!-- LIGHTBOX -->
  <div class="weekly-lightbox" id="weeklyLightbox">
    <button class="weekly-close" id="weeklyClose">&times;</button>
  <button class="weekly-nav weekly-prev" id="weeklyPrev"><i class="fas fa-chevron-left"></i></button>
<button class="weekly-nav weekly-next" id="weeklyNext"><i class="fas fa-chevron-right"></i></button>

    <div class="weekly-content">
      <img class="weekly-img" id="weeklyImg" src="" alt="">
      <div class="weekly-info">
        <div class="weekly-author" id="weeklyAuthor"></div>
      </div>
    </div>
  </div>

   
<!-- الفوتر -->
 <div id="footer"></div>
<script>
  fetch("components/footer.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
    });
</script>


<!-- السكرول  -->
<script>
  window.addEventListener("scroll", function () {
    const navbar = document.querySelector(".navbar");
    if (window.scrollY > 50) {
      navbar.classList.add("scrolled");
    } else {
      navbar.classList.remove("scrolled");
    }
  });
</script>

<!-- JS FILES -->
  <script src="js/weekly-data.js"></script>

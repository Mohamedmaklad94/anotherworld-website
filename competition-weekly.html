html, body {

body.weekly {

/* ====== HERO SLIDER ====== */
.weekly-slider-hero {
  position: relative;
  width: 100%;
  height: 700px;
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 2.0rem;
  font-family: "Cairo", sans-serif;
}

.weekly-slider-hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.3);
}

.weekly-slider-hero .hero-content {
  position: relative;
  z-index: 2;
  color: #fff;
}

.weekly-slider-hero .weekly-slider-dots {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 2;
}

.weekly-slider-hero .dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: rgba(255,255,255,0.5);
  cursor: pointer;
}

.weekly-slider-hero .dot.active { background: #fff; }

.weekly-slider-hero .weekly-slider-prev,
.weekly-slider-hero .weekly-slider-next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.5);
  border: none;
  color: white;
  font-size: 2rem;
  padding: 5px 10px;
  cursor: pointer;
  z-index: 2;
}

.weekly-slider-hero .weekly-slider-prev { left: 20px; }
.weekly-slider-hero .weekly-slider-next { right: 20px; }

/* ====== GALLERY ====== */
.weekly-gallery {
padding: 80px 5%!important;
background: #f5f5f5; /* خلفية فاتحة */
  color: #111;
}

.month-section {
  margin-bottom: 40px;
  border-bottom: 1px solid #ccc;
}

.month-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 2rem;
  cursor: pointer;
  margin-bottom: 10px;
}

.week-section {
  margin-left: 20px;
  margin-bottom: 20px;
  display: none;
}

.week-section.open { display: block; }

.week-title {
  font-size: 1.3rem;
  margin-bottom: 10px;
  color: #333;
  cursor: pointer;
}

.week-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
  margin-bottom: 50px;
}

.week-item {
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  cursor: pointer;
}

.week-item img {
  width: 100%;
  height: 360px;
  object-fit: cover;
  transition: transform 0.6s ease;
}

.week-item:hover img {
  transform: scale(1.1);
}

.week-overlay {
  position: absolute;
  bottom: 0;
  inset-inline: 0;
  padding: 15px;
  background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
  opacity: 0;
  transition: opacity 0.4s ease;
}

.week-overlay span {
  font-size: 1rem;
  font-weight: 500;
  color: #fff;
}

.week-item:hover .week-overlay {
  opacity: 1;
}

.week-grid {
  overflow: hidden;
}
.week-section {
  overflow: hidden;
}


.weekly-gallery:empty {
display: none;
background: #e6e6e6;

}


/* ====== LIGHTBOX ====== */
.weekly-lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.weekly-lightbox.active {
  display: flex;
}

.weekly-lightbox img {
  width: auto !important;
  height: auto !important;
  max-width: 90vw !important;
  max-height: 80vh !important;
  object-fit: contain !important;
  display: block;
  margin: auto;
}


.weekly-close,
.weekly-prev,
.weekly-next {
  position: absolute;
  background: none;
  border: none;
  color: white;
  font-size: 2.5rem;
  cursor: pointer;
  z-index: 10000;
}

.weekly-close {
  top: 20px;
  right: 30px;
}

.weekly-prev {
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
}

.weekly-next {
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
}

.weekly-info {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10000;
}

#weeklyAuthor {
  font-size: 1.6rem;
  font-weight: 700;
  color: #fff;
  padding: 8px 18px;
  /*background: rgba(0,0,0,0.55);*/
  border-radius: 8px;
  text-shadow: 0 2px 6px rgba(0,0,0,0.8);
}

.weekly-slider-prev:hover,
.weekly-slider-next:hover {
  background: #fff;
  color: #000;
 /* transform: scale(1.15);*/
}

.weekly-prev:hover,
.weekly-next:hover {
  background: #fff;
  color: #000;
}

  <div id="header"></div>
<script>
  function initHeader(){
    const navbar = document.querySelector("header.navbar");
    if(!navbar) return;

    const navBtn = document.getElementById("navToggle");
    const closeMenu = document.getElementById("closeMenu");

    const openSearch = document.getElementById("openSearch");
    const overlay = document.getElementById("searchOverlay");
    const closeSearch = document.getElementById("closeSearch");
    const input = document.getElementById("searchInput");

    // فتح/قفل المنيو
    if(navBtn){
      navBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        navbar.classList.toggle("open");
        navBtn.setAttribute("aria-expanded", navbar.classList.contains("open") ? "true" : "false");
      });
    }

    if(closeMenu){
      closeMenu.addEventListener("click", () => {
        navbar.classList.remove("open");
        navBtn?.setAttribute("aria-expanded","false");
      });
    }

    // اقفل المنيو لما تدوس بره
    document.addEventListener("click", (e) => {
      const nav = document.getElementById("mainNav");
      if(!nav) return;
      if(navbar.classList.contains("open") && !nav.contains(e.target) && e.target !== navBtn){
        navbar.classList.remove("open");
        navBtn?.setAttribute("aria-expanded","false");
      }
    });

    // =========================
    // =========================
// MOBILE: dropdown click accordion (ONLY)
// =========================
const isMobile = window.matchMedia("(max-width: 900px)");

function bindMobileDropdowns(){
  const nav = document.getElementById("mainNav");
  if(!nav) return;

  const dropdowns = nav.querySelectorAll(":scope > .dropdown");

  function closeAll(except){
    dropdowns.forEach(dd=>{
      if(dd !== except){
        dd.classList.remove("is-open");
        const t = dd.querySelector(":scope > span");
        t && t.setAttribute("aria-expanded","false");
      }
    });
  }

  dropdowns.forEach(dd=>{
    const trigger = dd.querySelector(":scope > span");
    const menu = dd.querySelector(":scope > .dropdown-menu");
    if(!trigger || !menu) return;

    trigger.setAttribute("role","button");
    trigger.setAttribute("tabindex","0");
    trigger.setAttribute("aria-expanded","false");

    const toggle = (e)=>{
      if(!isMobile.matches) return;
      e.preventDefault();
      e.stopPropagation();

      const open = dd.classList.contains("is-open");
      closeAll(dd);

      if(open){
        dd.classList.remove("is-open");
        trigger.setAttribute("aria-expanded","false");
      }else{
        dd.classList.add("is-open");
        trigger.setAttribute("aria-expanded","true");
      }
    };

    trigger.addEventListener("click", toggle);
    trigger.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" || e.key === " "){ toggle(e); }
    });
  });
}

bindMobileDropdowns();




    // البحث Overlay
    if(openSearch && overlay && closeSearch && input){
      openSearch.addEventListener("click", (e) => {
        e.stopPropagation();
        navbar.classList.remove("open");
        navbar.classList.add("search-open");
        overlay.setAttribute("aria-hidden","false");
        setTimeout(()=>input.focus(), 50);
      });

      function closeIt(){
        input && input.blur();                 // ✅ شيل الفوكس من input
        navbar.classList.remove("search-open");
        overlay.setAttribute("aria-hidden","true");
        input && (input.value = "");
      }



      closeSearch.addEventListener("click", closeIt);
      overlay.addEventListener("click", (e)=>{ if(e.target===overlay) closeIt(); });
      document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeIt(); });
    }
  }

  function lockMobilePinnedHeader(){
  const isMobile = window.matchMedia("(max-width: 768px)").matches;
  if(!isMobile) return;

  const host = document.getElementById("header");
  const navbar = host?.querySelector("header.navbar");
  if(!host || !navbar) return;

  // امسح أي آثار من سكربت السكرول
  navbar.classList.remove("hide","is-hidden","scrolled");

  // احسب الارتفاع الحقيقي واعمله padding-top للجسم
  const h = Math.ceil(navbar.getBoundingClientRect().height || 64);
  document.documentElement.style.setProperty("--nav-h", h + "px");
  document.body.style.paddingTop = h + "px";
}

  fetch("components/header.html")
    .then(r => r.text())
    .then(html => {
      document.getElementById("header").innerHTML = html;
      initHeader();
      lockMobilePinnedHeader();   // ✅ تثبيت الموبايل
      window.addEventListener("resize", lockMobilePinnedHeader);
      window.addEventListener("orientationchange", lockMobilePinnedHeader);


    });
</script>




<!-- السكرول  -->
<script>
  // DESKTOP ONLY: scrolled header
  (function(){
    const mq = window.matchMedia("(max-width: 768px)");
    function onScroll(){
      const navbar = document.querySelector("header.navbar");
      if(!navbar) return;
      if (window.scrollY > 50) navbar.classList.add("scrolled");
      else navbar.classList.remove("scrolled");
    }

    function bind(){
      // لو موبايل: شيل scrolled واقفل التأثير
      if(mq.matches){
        const navbar = document.querySelector("header.navbar");
        navbar && navbar.classList.remove("scrolled");
        window.removeEventListener("scroll", onScroll);
        return;
      }
      // لو ديسكتوب: شغل
      window.addEventListener("scroll", onScroll, { passive:true });
      onScroll();
    }

    // أول مرة + عند تغيير المقاس
    bind();
    mq.addEventListener?.("change", bind);
  })();
</script>

<style>
/* الهيرو */
.portrait-hero {
    position: relative;
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: none;
}

/* Overlay */
.portrait-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.18);
    z-index: 1;
}

/* العنوان */
.portrait-hero h1 {
    position: relative;
    z-index: 2;
    font-family: 'Montserrat', sans-serif;
    font-size: 5rem;
    font-weight: 600;
    color: white;
    margin-bottom: 140px;
    letter-spacing: 0px;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.100);
}

/* أزرار Next/Prev */
.portrait-prev,
.portrait-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    width: 60px;
    height: 60px;
    background: rgba(0,0,0,0.4);
    border: none;
    border-radius: 8px;
    font-size: 32px;
    color: white;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

.portrait-prev { left: 40px; }
.portrait-next { right: 40px; }

/* Dots */
.portrait-dots {
    position: absolute;
    bottom: 40px;
    display: flex;
    gap: 12px;
    z-index: 3;
}

.portrait-dots .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    cursor: pointer;
    transition: 0.2s;
}

.portrait-dots .dot.active {
    background: white;
    transform: scale(1.2);
}

/* Hover */
.portrait-prev:hover,
.portrait-next:hover {
    background: rgba(255,255,255,0.6);
    color: black;
    transform: translateY(-50%) scale(1.15);
}

/* ===== LIGHTBOX — portrait Only ===== */
.portrait-lightbox {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: opacity .3s ease;
}

.portrait-lightbox.active {
  display: flex;
  opacity: 1;
}

.portrait-content {
  position: relative;
  max-width: 90%;
  max-height: 90%;
}

.portrait-img {
  max-width: 100%;
  max-height: 85vh;
  border-radius: 8px;
}

.portrait-info {
  text-align: center;
  color: #fff;
  margin-top: 10px;
}

.portrait-author {
  font-size: 1.3rem;
  font-weight: 600;
}

/* Close button */
.portrait-close {
  position: absolute;
  top: 20px;
  right: 20px;
  background: none;
  border: none;
  color: white;
  font-size: 3rem;
  cursor: pointer;
}

/* Navigation arrows */
.portrait-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  font-size: 2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.portrait-prev { left: 20px; }
.portrait-next { right: 20px; }

.latest-works {
  min-height: 800px; }
  
  .hidden {
    display: none !important;
}

@media (max-width: 768px){

  /* الهيرو */
  .portrait-hero{
    min-height: 72vh !important;          /* بدل 100vh عشان ميبقاش فاضي تحت */
    height: 72vh !important;
    padding: 0 !important;
    display: block !important;            /* بدل flex */
    background-position: center center !important;
    background-size: cover !important;
  }

  /* أوفرلاي خفيف + جراديانت تحت */

    background: linear-gradient(

      rgba(0,0,0,0.20) 0%,
      rgba(0,0,0,0.10) 55%,
      rgba(0,0,0,0.55) 100%
    ) !important;
  }

  /* العنوان: ثبّته فوق الصورة */
  .portrait-hero h1{
    position: absolute !important;
    left: 50% !important;
    bottom: 18px !important;              /* بدل margin-bottom */
    transform: translateX(-50%) !important;

    margin: 0 !important;
    width: calc(100% - 28px) !important;
    text-align: center !important;

    font-size: 2.2rem !important;
    line-height: 1.1 !important;
    letter-spacing: 0 !important;
    z-index: 5 !important;

    /* صندوق بلور خلف العنوان */
    padding: 14px 16px !important;
    border-radius: 16px !important;
    text-shadow: 0 6px 22px rgba(0,0,0,0.45) !important;
  }

  /* الأزرار (prev/next) على الموبايل تكون فوق الصورة وتحت شوية */
  .portrait-prev,
  .portrait-next{
    top: 40% !important;
    bottom: auto !important;              /* فوق العنوان */
    transform: none !important;

    width: 48px !important;
    height: 48px !important;
    font-size: 28px !important;
    border-radius: 12px !important;

  
  }

  .portrait-prev{ left: 14px !important; }
  .portrait-next{ right: 14px !important; }

  /* الدوتس */
  .portrait-dots{
  left: 50% !important;
  transform: translateX(-50%) !important;
  right: auto !important;

  bottom: 12px !important;   /* قربها لتحت */
  justify-content: center !important;
  width: 100% !important;
  gap: 10px !important;
  z-index: 6 !important;
}
/* ===== MOBILE: LIGHTBOX FIX ===== */
.portrait-lightbox.active{
  align-items: center !important;
}

.portrait-content{
  width: 100% !important;
  max-width: 100% !important;
  max-height: 100% !important;

}

.portrait-img{
  width: 100% !important;
  max-height: 75vh !important;
  height: auto !important;
  object-fit: contain !important;     /* الأهم: الصورة تظهر كاملة */
}

/* زر الإغلاق فوق ثابت */
.portrait-close{
  top: 12px !important;
  right: 12px !important;
  z-index: 10001 !important;
  font-size: 2.2rem !important;
}

/* الأسهم يمين/شمال في نص الشاشة */
.portrait-nav{
  top: 50% !important;

}

#architecturePrev{ left: 10px !important; }
#architectureNext{ right: 10px !important; }

}

<!-- HEADER -->
<div id="header"></div>
<script>
  function initHeader(){
    const navbar = document.querySelector("header.navbar");
    if(!navbar) return;

    const navBtn = document.getElementById("navToggle");
    const closeMenu = document.getElementById("closeMenu");

    const openSearch = document.getElementById("openSearch");
    const overlay = document.getElementById("searchOverlay");
    const closeSearch = document.getElementById("closeSearch");
    const input = document.getElementById("searchInput");

    // فتح/قفل المنيو
    if(navBtn){
      navBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        navbar.classList.toggle("open");
        navBtn.setAttribute("aria-expanded", navbar.classList.contains("open") ? "true" : "false");
      });
    }

    if(closeMenu){
      closeMenu.addEventListener("click", () => {
        navbar.classList.remove("open");
        navBtn?.setAttribute("aria-expanded","false");
      });
    }

    // اقفل المنيو لما تدوس بره
    document.addEventListener("click", (e) => {
      const nav = document.getElementById("mainNav");
      if(!nav) return;
      if(navbar.classList.contains("open") && !nav.contains(e.target) && e.target !== navBtn){
        navbar.classList.remove("open");
        navBtn?.setAttribute("aria-expanded","false");
      }
    });

    // =========================
    // =========================
// MOBILE: dropdown click accordion (ONLY)
// =========================
const isMobile = window.matchMedia("(max-width: 900px)");

function bindMobileDropdowns(){
  const nav = document.getElementById("mainNav");
  if(!nav) return;

  const dropdowns = nav.querySelectorAll(":scope > .dropdown");

  function closeAll(except){
    dropdowns.forEach(dd=>{
      if(dd !== except){
        dd.classList.remove("is-open");
        const t = dd.querySelector(":scope > span");
        t && t.setAttribute("aria-expanded","false");
      }
    });
  }

  dropdowns.forEach(dd=>{
    const trigger = dd.querySelector(":scope > span");
    const menu = dd.querySelector(":scope > .dropdown-menu");
    if(!trigger || !menu) return;

    trigger.setAttribute("role","button");
    trigger.setAttribute("tabindex","0");
    trigger.setAttribute("aria-expanded","false");

    const toggle = (e)=>{
      if(!isMobile.matches) return;
      e.preventDefault();
      e.stopPropagation();

      const open = dd.classList.contains("is-open");
      closeAll(dd);

      if(open){
        dd.classList.remove("is-open");
        trigger.setAttribute("aria-expanded","false");
      }else{
        dd.classList.add("is-open");
        trigger.setAttribute("aria-expanded","true");
      }
    };

    trigger.addEventListener("click", toggle);
    trigger.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" || e.key === " "){ toggle(e); }
    });
  });
}

bindMobileDropdowns();




    // البحث Overlay
    if(openSearch && overlay && closeSearch && input){
      openSearch.addEventListener("click", (e) => {
        e.stopPropagation();
        navbar.classList.remove("open");
        navbar.classList.add("search-open");
        overlay.setAttribute("aria-hidden","false");
        setTimeout(()=>input.focus(), 50);
      });

      function closeIt(){
        input && input.blur();                 // ✅ شيل الفوكس من input
        navbar.classList.remove("search-open");
        overlay.setAttribute("aria-hidden","true");
        input && (input.value = "");
      }



      closeSearch.addEventListener("click", closeIt);
      overlay.addEventListener("click", (e)=>{ if(e.target===overlay) closeIt(); });
      document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeIt(); });
    }
  }

  function lockMobilePinnedHeader(){
  const isMobile = window.matchMedia("(max-width: 768px)").matches;
  if(!isMobile) return;

  const host = document.getElementById("header");
  const navbar = host?.querySelector("header.navbar");
  if(!host || !navbar) return;

  // امسح أي آثار من سكربت السكرول
  navbar.classList.remove("hide","is-hidden","scrolled");

  // احسب الارتفاع الحقيقي واعمله padding-top للجسم
  const h = Math.ceil(navbar.getBoundingClientRect().height || 64);
  document.documentElement.style.setProperty("--nav-h", h + "px");
  document.body.style.paddingTop = h + "px";
}

  fetch("components/header.html")
    .then(r => r.text())
    .then(html => {
      document.getElementById("header").innerHTML = html;
      initHeader();
      lockMobilePinnedHeader();   // ✅ تثبيت الموبايل
      window.addEventListener("resize", lockMobilePinnedHeader);
      window.addEventListener("orientationchange", lockMobilePinnedHeader);


    });
</script>




<!-- السكرول  -->
<script>
  // DESKTOP ONLY: scrolled header
  (function(){
    const mq = window.matchMedia("(max-width: 768px)");
    function onScroll(){
      const navbar = document.querySelector("header.navbar");
      if(!navbar) return;
      if (window.scrollY > 50) navbar.classList.add("scrolled");
      else navbar.classList.remove("scrolled");
    }

    function bind(){
      // لو موبايل: شيل scrolled واقفل التأثير
      if(mq.matches){
        const navbar = document.querySelector("header.navbar");
        navbar && navbar.classList.remove("scrolled");
        window.removeEventListener("scroll", onScroll);
        return;
      }
      // لو ديسكتوب: شغل
      window.addEventListener("scroll", onScroll, { passive:true });
      onScroll();
    }

    // أول مرة + عند تغيير المقاس
    bind();
    mq.addEventListener?.("change", bind);
  })();
</script>

<!-- LIGHTBOX SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const portrait = document.getElementById('portraitLightbox');
  const portraitImg = document.getElementById('portraitImg');
  const portraitAuthor = document.getElementById('portraitAuthor');
  const portraitClose = document.getElementById('portraitClose');
  const portraitPrev = document.getElementById('portraitPrev');
  const portraitNext = document.getElementById('portraitNext');
  window.openportrait = function(photo, index) {
      portraitImg.src = photo.image;
      portraitAuthor.textContent = photo.author;
      portrait.classList.add('active');
      document.body.style.overflow = 'hidden';
      portrait.dataset.index = index;
  }

  function closeportrait() {
      portrait.classList.remove('active');
      document.body.style.overflow = 'auto';
  }

  function navportrait(dir) {
      let idx = parseInt(portrait.dataset.index);
      if (dir === 'next') idx = (idx + 1) % portraitPhotos.length;
      else idx = (idx - 1 + portraitPhotos.length) % portraitPhotos.length;

      const photo = portraitPhotos[idx];
      portraitImg.src = photo.image;
      portraitAuthor.textContent = photo.author;
      portrait.dataset.index = idx;
  }

  portraitClose.onclick = closeportrait;
  portraitPrev.onclick = () => navportrait('prev');
  portraitNext.onclick = () => navportrait('next');

  document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeportrait();
  });
});
</script>

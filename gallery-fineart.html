<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>  فن التصوير fine art - Another World Photography</title>
  <link rel="stylesheet" href="css/style-v3.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* الهيرو */
.fineart-hero {
    position: relative;
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: none;
}

/* Overlay */
.fineart-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.18);
    z-index: 1;
}

/* العنوان */
.fineart-hero h1 {
    position: relative;
    z-index: 2;
    font-family: 'Montserrat', sans-serif;
    font-size: 5rem;
    font-weight: 600;
    color: white;
    margin-bottom: 140px;
    letter-spacing: 0px;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.100);
}

/* أزرار Next/Prev */
.fineart-prev,
.fineart-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    width: 60px;
    height: 60px;
    background: rgba(0,0,0,0.4);
    border: none;
    border-radius: 8px;
    font-size: 32px;
    color: white;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

.fineart-prev { left: 40px; }
.fineart-next { right: 40px; }

/* Dots */
.fineart-dots {
    position: absolute;
    bottom: 40px;
    display: flex;
    gap: 12px;
    z-index: 3;
}

.fineart-dots .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    cursor: pointer;
    transition: 0.2s;
}

.fineart-dots .dot.active {
    background: white;
    transform: scale(1.2);
}

/* Hover */
.fineart-prev:hover,
.fineart-next:hover {
    background: rgba(255,255,255,0.6);
    color: black;
    transform: translateY(-50%) scale(1.15);
}

/* ===== LIGHTBOX — fineart Only ===== */
.fineart-lightbox {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: opacity .3s ease;
}

.fineart-lightbox.active {
  display: flex;
  opacity: 1;
}

.fineart-content {
  position: relative;
  max-width: 90%;
  max-height: 90%;
}

.fineart-img {
  max-width: 100%;
  max-height: 85vh;
  border-radius: 8px;
}

.fineart-info {
  text-align: center;
  color: #fff;
  margin-top: 10px;
}

.fineart-author {
  font-size: 1.3rem;
  font-weight: 600;
}

/* Close button */
.fineart-close {
  position: absolute;
  top: 20px;
  right: 20px;
  background: none;
  border: none;
  color: white;
  font-size: 3rem;
  cursor: pointer;
}

/* Navigation arrows */
.fineart-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  font-size: 2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fineart-prev { left: 20px; }
.fineart-next { right: 20px; }

.latest-works {
  min-height: 800px; }
  
  .hidden {
    display: none !important;
}


</style>
</head>

<body class="about-body">

<!-- HEADER -->
<div id="header"></div>
<script>
  function initHeader(){
    const navbar = document.querySelector("header.navbar");
    if(!navbar) return;

    const navBtn = document.getElementById("navToggle");
    const closeMenu = document.getElementById("closeMenu");

    const openSearch = document.getElementById("openSearch");
    const overlay = document.getElementById("searchOverlay");
    const closeSearch = document.getElementById("closeSearch");
    const input = document.getElementById("searchInput");

    // فتح/قفل المنيو
    if(navBtn){
      navBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        navbar.classList.toggle("open");
        navBtn.setAttribute("aria-expanded", navbar.classList.contains("open") ? "true" : "false");
      });
    }

    if(closeMenu){
      closeMenu.addEventListener("click", () => {
        navbar.classList.remove("open");
        navBtn?.setAttribute("aria-expanded","false");
      });
    }

    // اقفل المنيو لما تدوس بره
    document.addEventListener("click", (e) => {
      const nav = document.getElementById("mainNav");
      if(!nav) return;
      if(navbar.classList.contains("open") && !nav.contains(e.target) && e.target !== navBtn){
        navbar.classList.remove("open");
        navBtn?.setAttribute("aria-expanded","false");
      }
    });

    // =========================
    // =========================
// MOBILE: dropdown click accordion (ONLY)
// =========================
const isMobile = window.matchMedia("(max-width: 900px)");

function bindMobileDropdowns(){
  const nav = document.getElementById("mainNav");
  if(!nav) return;

  const dropdowns = nav.querySelectorAll(":scope > .dropdown");

  function closeAll(except){
    dropdowns.forEach(dd=>{
      if(dd !== except){
        dd.classList.remove("is-open");
        const t = dd.querySelector(":scope > span");
        t && t.setAttribute("aria-expanded","false");
      }
    });
  }

  dropdowns.forEach(dd=>{
    const trigger = dd.querySelector(":scope > span");
    const menu = dd.querySelector(":scope > .dropdown-menu");
    if(!trigger || !menu) return;

    trigger.setAttribute("role","button");
    trigger.setAttribute("tabindex","0");
    trigger.setAttribute("aria-expanded","false");

    const toggle = (e)=>{
      if(!isMobile.matches) return;
      e.preventDefault();
      e.stopPropagation();

      const open = dd.classList.contains("is-open");
      closeAll(dd);

      if(open){
        dd.classList.remove("is-open");
        trigger.setAttribute("aria-expanded","false");
      }else{
        dd.classList.add("is-open");
        trigger.setAttribute("aria-expanded","true");
      }
    };

    trigger.addEventListener("click", toggle);
    trigger.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" || e.key === " "){ toggle(e); }
    });
  });
}

bindMobileDropdowns();




    // البحث Overlay
    if(openSearch && overlay && closeSearch && input){
      openSearch.addEventListener("click", (e) => {
        e.stopPropagation();
        navbar.classList.remove("open");
        navbar.classList.add("search-open");
        overlay.setAttribute("aria-hidden","false");
        setTimeout(()=>input.focus(), 50);
      });

      function closeIt(){
        input && input.blur();                 // ✅ شيل الفوكس من input
        navbar.classList.remove("search-open");
        overlay.setAttribute("aria-hidden","true");
        input && (input.value = "");
      }



      closeSearch.addEventListener("click", closeIt);
      overlay.addEventListener("click", (e)=>{ if(e.target===overlay) closeIt(); });
      document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeIt(); });
    }
  }

  function lockMobilePinnedHeader(){
  const isMobile = window.matchMedia("(max-width: 768px)").matches;
  if(!isMobile) return;

  const host = document.getElementById("header");
  const navbar = host?.querySelector("header.navbar");
  if(!host || !navbar) return;

  // امسح أي آثار من سكربت السكرول
  navbar.classList.remove("hide","is-hidden","scrolled");

  // احسب الارتفاع الحقيقي واعمله padding-top للجسم
  const h = Math.ceil(navbar.getBoundingClientRect().height || 64);
  document.documentElement.style.setProperty("--nav-h", h + "px");
  document.body.style.paddingTop = h + "px";
}

  fetch("components/header.html")
    .then(r => r.text())
    .then(html => {
      document.getElementById("header").innerHTML = html;
      initHeader();
      lockMobilePinnedHeader();   // ✅ تثبيت الموبايل
      window.addEventListener("resize", lockMobilePinnedHeader);
      window.addEventListener("orientationchange", lockMobilePinnedHeader);


    });
</script>




<!-- السكرول  -->
<script>
  // DESKTOP ONLY: scrolled header
  (function(){
    const mq = window.matchMedia("(max-width: 768px)");
    function onScroll(){
      const navbar = document.querySelector("header.navbar");
      if(!navbar) return;
      if (window.scrollY > 50) navbar.classList.add("scrolled");
      else navbar.classList.remove("scrolled");
    }

    function bind(){
      // لو موبايل: شيل scrolled واقفل التأثير
      if(mq.matches){
        const navbar = document.querySelector("header.navbar");
        navbar && navbar.classList.remove("scrolled");
        window.removeEventListener("scroll", onScroll);
        return;
      }
      // لو ديسكتوب: شغل
      window.addEventListener("scroll", onScroll, { passive:true });
      onScroll();
    }

    // أول مرة + عند تغيير المقاس
    bind();
    mq.addEventListener?.("change", bind);
  })();
</script>

<!-- HERO -->
<section class="gallery-hero fineart-hero">
    <div class="fineart-overlay"></div>
    <h1>FINE ART</h1>

    <button class="fineart-prev prev" id="fineart-prev">›</button>

<!-- LIGHTBOX HTML -->
<div class="fineart-lightbox" id="fineartLightbox">
    <button class="fineart-close" id="fineartClose">&times;</button>
    <button class="fineart-nav fineart-prev" id="fineartPrev">›</button>
    <button class="fineart-nav fineart-next" id="fineartNext">‹</button>
    <div class="fineart-content">
        <img class="fineart-img" id="fineartImg" src="" alt="">
        <div class="fineart-info">
            <div class="fineart-author" id="fineartAuthor"></div>
        </div>
    </div>
</div>

<!-- LIGHTBOX SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const fineart = document.getElementById('fineartLightbox');
  const fineartImg = document.getElementById('fineartImg');
  const fineartAuthor = document.getElementById('fineartAuthor');
  const fineartClose = document.getElementById('fineartClose');
  const fineartPrev = document.getElementById('fineartPrev');
  const fineartNext = document.getElementById('fineartNext');
  window.openfineart = function(photo, index) {
      fineartImg.src = photo.image;
      fineartAuthor.textContent = photo.author;
      fineart.classList.add('active');
      document.body.style.overflow = 'hidden';
      fineart.dataset.index = index;
  }

  function closefineart() {
      fineart.classList.remove('active');
      document.body.style.overflow = 'auto';
  }

  function navfineart(dir) {
      let idx = parseInt(fineart.dataset.index);
      if (dir === 'next') idx = (idx + 1) % fineartPhotos.length;
      else idx = (idx - 1 + fineartPhotos.length) % fineartPhotos.length;

      const photo = fineartPhotos[idx];
      fineartImg.src = photo.image;
      fineartAuthor.textContent = photo.author;
      fineart.dataset.index = idx;
  }

  fineartClose.onclick = closefineart;
  fineartPrev.onclick = () => navfineart('prev');
  fineartNext.onclick = () => navfineart('next');

  document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closefineart();
  });
});
</script>

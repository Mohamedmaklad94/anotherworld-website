<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>  منتجات product - Another World Photography</title>
  <link rel="stylesheet" href="css/style-v3.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
/* الهيرو */
.product-hero {
    position: relative;
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: none;
}

/* Overlay */
.product-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.18);
    z-index: 1;
}

/* العنوان */
.product-hero h1 {
    position: relative;
    z-index: 2;
    font-family: 'Montserrat', sans-serif;
    font-size: 5rem;
    font-weight: 600;
    color: white;
    margin-bottom: 140px;
    letter-spacing: 0px;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.100);
}

/* أزرار Next/Prev */
.product-prev,
.product-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    width: 60px;
    height: 60px;
    background: rgba(0,0,0,0.4);
    border: none;
    border-radius: 8px;
    font-size: 32px;
    color: white;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

.product-prev { left: 40px; }
.product-next { right: 40px; }

/* Dots */
.product-dots {
    position: absolute;
    bottom: 40px;
    display: flex;
    gap: 12px;
    z-index: 3;
}

.product-dots .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    cursor: pointer;
    transition: 0.2s;
}

.product-dots .dot.active {
    background: white;
    transform: scale(1.2);
}

/* Hover */
.product-prev:hover,
.product-next:hover {
    background: rgba(255,255,255,0.6);
    color: black;
    transform: translateY(-50%) scale(1.15);
}

/* ===== LIGHTBOX — product Only ===== */
.product-lightbox {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: opacity .3s ease;
}

.product-lightbox.active {
  display: flex;
  opacity: 1;
}

.product-content {
  position: relative;
  max-width: 90%;
  max-height: 90%;
}

.product-img {
  max-width: 100%;
  max-height: 85vh;
  border-radius: 8px;
}

.product-info {
  text-align: center;
  color: #fff;
  margin-top: 10px;
}

.product-author {
  font-size: 1.3rem;
  font-weight: 600;
}

/* Close button */
.product-close {
  position: absolute;
  top: 20px;
  right: 20px;
  background: none;
  border: none;
  color: white;
  font-size: 3rem;
  cursor: pointer;
}

/* Navigation arrows */
.product-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  font-size: 2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.product-prev { left: 20px; }
.product-next { right: 20px; }

.latest-works {
  min-height: 800px; }
  
  .hidden {
    display: none !important;
}


</style>
</head>

<body class="about-body">

<!-- HEADER -->
<div id="header"></div>
<script>
  fetch("components/header.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("header").innerHTML = data;
    });
</script>

<!-- HERO -->
<section class="gallery-hero product-hero">
    <div class="product-overlay"></div>
    <h1>PRODUCTS</h1>

    <button class="product-prev prev" id="product-prev">›</button>
    <button class="product-next next" id="product-next">‹</button>
    <div class="product-dots"></div>
</section>

<script src="js/product-slider.js"></script>

<!-- LIGHTBOX HTML -->
<div class="product-lightbox" id="productLightbox">
    <button class="product-close" id="productClose">&times;</button>
    <button class="product-nav product-prev" id="productPrev">›</button>
    <button class="product-nav product-next" id="productNext">‹</button>
    <div class="product-content">
        <img class="product-img" id="productImg" src="" alt="">
        <div class="product-info">
            <div class="product-author" id="productAuthor"></div>
        </div>
    </div>
</div>

<!-- LIGHTBOX SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const product = document.getElementById('productLightbox');
  const productImg = document.getElementById('productImg');
  const productAuthor = document.getElementById('productAuthor');
  const productClose = document.getElementById('productClose');
  const productPrev = document.getElementById('productPrev');
  const productNext = document.getElementById('productNext');
  window.openproduct = function(photo, index) {
      productImg.src = photo.image;
      productAuthor.textContent = photo.author;
      product.classList.add('active');
      document.body.style.overflow = 'hidden';
      product.dataset.index = index;
  }

  function closeproduct() {
      product.classList.remove('active');
      document.body.style.overflow = 'auto';
  }

  function navproduct(dir) {
      let idx = parseInt(product.dataset.index);
      if (dir === 'next') idx = (idx + 1) % productPhotos.length;
      else idx = (idx - 1 + productPhotos.length) % productPhotos.length;

      const photo = productPhotos[idx];
      productImg.src = photo.image;
      productAuthor.textContent = photo.author;
      product.dataset.index = idx;
  }

  productClose.onclick = closeproduct;
  productPrev.onclick = () => navproduct('prev');
  productNext.onclick = () => navproduct('next');

  document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeproduct();
  });
});
</script>

<!-- GALLERY -->
<section class="latest-works">
    <div class="section-header">
      <h2>Product Gallery</h2>
      <p>أبرز صور المنتجات  من مجتمعنا</p>
    </div>

    <div class="photo-grid" id="photo-grid"></div>

    <button id="load-more-btn" class="load-more-btn hidden">More</button>
</section>

<!-- GALLERY SCRIPT -->
<script src="js/product-gallery.js"></script>

<!-- الفوتر -->
 <div id="footer"></div>
<script>
  fetch("components/footer.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
    });
</script>

<!-- HEADER SCROLL -->
<script>
  window.addEventListener("scroll", function () {
    const navbar = document.querySelector(".navbar");
    if (window.scrollY > 50) {
      navbar.classList.add("scrolled");
    } else {
      navbar.classList.remove("scrolled");
    }
  });
</script>

</body>
</html>
